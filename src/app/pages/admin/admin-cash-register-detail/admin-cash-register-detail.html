<section class="cash-detail-page">
  @if (loading()) {
    <section class="cash-detail-loading">
      <p-skeleton width="18rem" height="2rem" />
      <p-skeleton width="30rem" height="1rem" />

      <div class="cash-detail-loading__cards">
        @for (item of [1, 2, 3, 4]; track item) {
          <p-skeleton width="100%" height="8rem" borderRadius="1rem" />
        }
      </div>

      <p-skeleton width="100%" height="20rem" borderRadius="1.25rem" />
    </section>
  } @else if (detail(); as data) {
    <header class="cash-detail-header">
      <div class="cash-detail-header__copy">
        <span class="cash-detail-eyebrow">Control financiero</span>
        <h2>Detalle de caja</h2>
        <p>Consulta el resumen financiero, los pedidos en efectivo y los movimientos de esta sesión.</p>
      </div>

      <div class="cash-detail-header__actions">
        <p-button
          icon="pi pi-arrow-left"
          label="Volver al historial"
          severity="secondary"
          [outlined]="true"
          routerLink="/admin/cash-register/history"
        />
        <p-button
          icon="pi pi-refresh"
          label="Actualizar"
          severity="secondary"
          [outlined]="true"
          [loading]="refreshing()"
          [disabled]="refreshing()"
          (onClick)="refresh()"
        />
        @if (data.session.status === 'open') {
          <p-button icon="pi pi-wallet" label="Ir a caja actual" routerLink="/admin/cash-register" />
        }
      </div>
    </header>

    <app-admin-cash-register-detail-view [detail]="data" />
  }
</section>
