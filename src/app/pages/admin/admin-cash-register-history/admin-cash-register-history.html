<section class="cash-history-page">
  <header class="cash-history-header">
    <div>
      <span class="cash-history-eyebrow">Control financiero</span>
      <h2>Historial de cajas</h2>
      <p>Consulta las aperturas, cierres, arqueos y diferencias registradas.</p>
    </div>

    <div class="cash-history-header__actions">
      <p-button
        icon="pi pi-arrow-left"
        label="Volver a caja"
        severity="secondary"
        [outlined]="true"
        routerLink="/admin/cash-register"
      />
      <p-button
        icon="pi pi-refresh"
        label="Actualizar"
        severity="secondary"
        [outlined]="true"
        [loading]="refreshing()"
        [disabled]="refreshing()"
        (onClick)="refresh()"
      />
    </div>
  </header>

  <section class="cash-history-filters">
    <div class="cash-history-filter">
      <label for="cash_history_from">Fecha inicial</label>
      <p-datepicker
        inputId="cash_history_from"
        [ngModel]="dateFrom()"
        (ngModelChange)="dateFrom.set($event)"
        dateFormat="dd/mm/yy"
        placeholder="Seleccionar fecha"
        appendTo="body"
        [showIcon]="true"
        [showButtonBar]="true"
        [fluid]="true"
      />
    </div>

    <div class="cash-history-filter">
      <label for="cash_history_to">Fecha final</label>
      <p-datepicker
        inputId="cash_history_to"
        [ngModel]="dateTo()"
        (ngModelChange)="dateTo.set($event)"
        dateFormat="dd/mm/yy"
        placeholder="Seleccionar fecha"
        appendTo="body"
        [showIcon]="true"
        [showButtonBar]="true"
        [fluid]="true"
      />
    </div>

    <div class="cash-history-filter">
      <span id="cash-history-status-label" class="cash-history-filter__label">Estado</span>
      <p-select
        inputId="cash_history_status"
        ariaLabelledBy="cash-history-status-label"
        [ngModel]="status()"
        (ngModelChange)="status.set($event)"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Todos los estados"
        appendTo="body"
        [fluid]="true"
      />
    </div>

    <div class="cash-history-filter__actions">
      <p-button icon="pi pi-search" label="Aplicar filtros" (onClick)="applyFilters()" />
      <p-button
        icon="pi pi-filter-slash"
        label="Limpiar"
        severity="secondary"
        [outlined]="true"
        [disabled]="!hasFilters()"
        (onClick)="clearFilters()"
      />
    </div>
  </section>

  <app-admin-cash-register-history-table
    [loading]="loading()"
    [sessions]="sessions()"
    [total]="total()"
    [first]="first()"
    [perPage]="perPage()"
    [visibleFrom]="visibleFrom()"
    [visibleTo]="visibleTo()"
    [hasFilters]="hasFilters()"
    (pageChange)="onPageChange($event)"
    (clearFilters)="clearFilters()"
  />
</section>
