<section class="dashboard-page">
  <section class="dashboard-toolbar">
    <div class="dashboard-toolbar__context">
      <span class="dashboard-toolbar__icon">
        <i class="pi pi-chart-bar"></i>
      </span>

      <div>
        <span class="dashboard-toolbar__eyebrow">
          Rendimiento comercial
        </span>

        <strong>{{ periodLabel() }}</strong>

        <small>
          @if (periodDays() > 0) {
            {{ periodDays() }}
            {{ periodDays() === 1 ? 'día analizado' : 'días analizados' }}
          } @else {
            Periodo administrativo
          }
        </small>
      </div>
    </div>

    <div class="dashboard-period">
      <div class="dashboard-period__field">
        <span>Desde</span>

        <p-datepicker
          inputId="dashboard_date_from"
          [ngModel]="dateFrom()"
          (ngModelChange)="dateFrom.set($event)"
          dateFormat="dd/mm/yy"
          appendTo="body"
          placeholder="Fecha inicial"
          [showIcon]="true"
          [showButtonBar]="true"
          [fluid]="true"
        />
      </div>

      <div class="dashboard-period__field">
        <span>Hasta</span>

        <p-datepicker
          inputId="dashboard_date_to"
          [ngModel]="dateTo()"
          (ngModelChange)="dateTo.set($event)"
          dateFormat="dd/mm/yy"
          appendTo="body"
          placeholder="Fecha final"
          [showIcon]="true"
          [showButtonBar]="true"
          [fluid]="true"
        />
      </div>

      <div class="dashboard-period__actions">
        <p-button
          icon="pi pi-search"
          label="Aplicar"
          (onClick)="applyPeriod()"
        />

        <p-button
          icon="pi pi-calendar-times"
          severity="secondary"
          [outlined]="true"
          [rounded]="true"
          ariaLabel="Restablecer periodo"
          pTooltip="Restablecer al mes actual"
          tooltipPosition="top"
          (onClick)="resetPeriod()"
        />
      </div>
    </div>
  </section>

  <app-admin-dashboard-overview
    [loading]="loading()"
    [summary]="summary()"
    [comparison]="comparison()"
    [data]="data()"
  />

  <app-admin-dashboard-analytics
    [loading]="loading()"
    [data]="data()"
  />
</section>
