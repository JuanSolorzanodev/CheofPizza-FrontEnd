<section class="analytics-page">
  <header class="analytics-toolbar">
    <div class="analytics-toolbar-copy">
      <p>Planifica la demanda futura y controla el ciclo de entrenamiento del modelo predictivo.</p>
    </div>

    <div class="header-actions">
      <p-button
        label="Actualizar"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        [loading]="activeLoading()"
        (onClick)="refreshActiveSection()"
      />

      @if (activeSection() === 'forecast') {
        <p-button
          label="Generar pronóstico"
          icon="pi pi-sparkles"
          severity="success"
          (onClick)="openGenerateDialog()"
        />
      }
    </div>
  </header>

  <nav class="analytics-tabs" aria-label="Secciones de analítica predictiva">
    <button
      type="button"
      class="analytics-tab"
      [class.analytics-tab-active]="activeSection() === 'forecast'"
      (click)="selectSection('forecast')"
    >
      <i class="pi pi-chart-line"></i>
      <span>Pronóstico de demanda</span>
    </button>

    <button
      type="button"
      class="analytics-tab"
      [class.analytics-tab-active]="activeSection() === 'comparison'"
      (click)="selectSection('comparison')"
    >
      <i class="pi pi-chart-bar"></i>
      <span>Predicción vs. ventas reales</span>
    </button>

    <button
      type="button"
      class="analytics-tab"
      [class.analytics-tab-active]="activeSection() === 'training'"
      (click)="selectSection('training')"
    >
      <i class="pi pi-microchip-ai"></i>
      <span>Entrenamiento y modelos</span>
    </button>
  </nav>

  @if (activeSection() === 'forecast') {
    <app-ml-forecast-dashboard />
  } @else if (activeSection() === 'comparison') {
    @defer (when activeSection() === 'comparison') {
      <app-machine-learning-comparison [refreshKey]="comparisonRefreshKey()" />
    } @loading {
      <section
        class="section-loading"
        aria-busy="true"
        aria-label="Cargando comparación predictiva"
      >
        <p-skeleton height="126px" borderRadius="18px" />
        <p-skeleton height="310px" borderRadius="18px" />
        <p-skeleton height="300px" borderRadius="18px" />
      </section>
    }
  } @else {
    <app-ml-training-dashboard (modelChanged)="onModelChanged()" />
  }
</section>
