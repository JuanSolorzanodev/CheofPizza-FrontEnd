<section class="promotion-page" aria-labelledby="promotion-title">
  @if (loading()) {
    <div class="promotion-loading" aria-label="Cargando promoción" aria-busy="true">
      <p-skeleton width="100%" height="220px" borderRadius="24px" />

      <div class="promotion-loading__layout">
        <div class="promotion-loading__content">
          <p-skeleton width="100%" height="340px" borderRadius="22px" />

          <p-skeleton width="100%" height="440px" borderRadius="22px" />
        </div>

        <p-skeleton width="100%" height="420px" borderRadius="22px" />
      </div>
    </div>
  } @else if (error()) {
    <section class="promotion-state promotion-state--error" role="alert">
      <span class="promotion-state__icon">
        <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      </span>

      <div class="promotion-state__copy">
        <span class="promotion-state__eyebrow"> Promoción no disponible </span>

        <h1>No pudimos cargar esta promoción</h1>

        <p>
          {{ error() }}
        </p>
      </div>

      <button type="button" class="secondary-action" (click)="goHome()">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>

        <span> Volver al inicio </span>
      </button>
    </section>
  } @else if (promotion(); as currentPromotion) {
    <app-promotion-hero
      [promotion]="currentPromotion"
      [isSizeFixedPrice]="isSizeFixedPrice()"
      [selectedSizePrice]="selectedSizePrice()"
      [selectedSizeName]="selectedSizeName()"
      [totalSlots]="slots().length"
      [configuredSlots]="configuredSlotsCount()"
      [maxExtrasPerPizza]="maxExtrasPerPizza"
    />

    <main class="promotion-layout">
      <div class="promotion-content">
        @if (requiresSizeSelection()) {
          <app-promotion-size-selector
            [options]="sizePriceOptions()"
            [selectedSizeId]="selectedSizeId()"
            [selectedSizePrice]="selectedSizePrice()"
            [stepNumber]="1"
            (sizeChange)="onSelectSize($event)"
          />
        }

        <app-promotion-pizza-selector
          [slots]="slots()"
          [selectedBySlot]="selectedBySlot()"
          [sencillas]="sencillas()"
          [especiales]="especiales()"
          [quantity]="quantity()"
          [requiresSizeSelection]="requiresSizeSelection()"
          [selectedSizeId]="selectedSizeId()"
          [selectedSizeName]="selectedSizeName()"
          [stepNumber]="requiresSizeSelection() ? 2 : 1"
          (quantityChange)="setQuantity($event)"
          (pizzaChange)="onPizzaSelectionChange($event)"
          (customize)="onCustomizePizza($event)"
        />

        @if (customizationItems().length > 0) {
          <app-promotion-pizza-customizer
            [items]="customizationItems()"
            [activeSlotKey]="activeCustomizationKey()"
            [stepNumber]="requiresSizeSelection() ? 3 : 2"
            (activate)="onActivateCustomization($event)"
            (resetRequested)="onResetCustomization($event)"
            (removeBaseIngredient)="onRemoveCustomizationBaseIngredient($event)"
            (restoreBaseIngredient)="onRestoreCustomizationBaseIngredient($event)"
            (toggleExtra)="onToggleCustomizationExtra($event)"
            (removeExtra)="onRemoveCustomizationExtra($event)"
          />
        }
      </div>

      <app-promotion-order-summary
        [items]="summaryItems()"
        [promotionBasePrice]="promotionBasePrice()"
        [extrasPerUnitTotal]="extrasPerUnitTotal()"
        [quantity]="quantity()"
        [total]="total()"
        [canSubmit]="canSubmit()"
        [submitting]="submitting()"
        [cartUnits]="cart.totalUnits()"
        [progressLabel]="progressLabel()"
        (addToCart)="addPromotionToCart()"
        (checkout)="goCheckout()"
      />
    </main>
  }
</section>
